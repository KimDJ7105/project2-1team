name: Deploy Frontend (prod)

on:
  push:
    branches: [prod]
    paths:
      - "client/**"

permissions:
  contents: read

concurrency:
  group: deploy-frontend-prod
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_FRONTEND_BUCKET: ${{ vars.S3_FRONTEND_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  # Vite는 빌드 시점에 이 값을 번들에 박아넣으므로 build 스텝 이전에 반드시 설정되어야 함
  VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run build

      # 임시: 계정 SCP가 GitHub OIDC의 sts:AssumeRoleWithWebIdentity를 막고 있어서
      # 관리자 확인 전까지 액세스키 방식으로 대체함. 해결되면 role-to-assume(OIDC)으로 복귀할 것
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_FRONTEND_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_FRONTEND_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # index.html은 캐시하면 새 배포를 못 받아볼 수 있어 짧게, 나머지 정적
      # 자산(해시된 파일명)은 오래 캐싱해도 안전하므로 길게 설정
      - name: sync build output to S3
        run: |
          aws s3 sync dist/ "s3://$S3_FRONTEND_BUCKET" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          aws s3 cp dist/index.html "s3://$S3_FRONTEND_BUCKET/index.html" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
