name: Deploy Frontend (dev)

on:
  push:
    branches: [dev]
    paths:
      - "client/**"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-frontend-dev
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_FRONTEND_BUCKET: ${{ vars.S3_FRONTEND_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # index.html은 캐시하면 새 배포를 못 받아볼 수 있어 짧게, 나머지 정적
      # 자산(해시된 파일명)은 오래 캐싱해도 안전하므로 길게 설정
      - name: sync build output to S3
        run: |
          aws s3 sync dist/ "s3://$S3_FRONTEND_BUCKET" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          aws s3 cp dist/index.html "s3://$S3_FRONTEND_BUCKET/index.html" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
