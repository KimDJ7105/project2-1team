# SecretStore: Secrets Manager 조회 방법/권한 정의
# team1-backend-sa의 IRSA 권한(team1-backend-irsa)으로 조회함
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: team1-secretstore
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: team1-backend-sa
---
# ExternalSecret: 민감정보(DB_USERNAME, DB_PASSWORD)만 최소 권한으로 조회
# dataFrom(전체 가져오기) 대신 필요한 키만 하나씩 지정
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: team1-backend-secret
  namespace: default
spec:
  refreshInterval: 1h  # 1시간마다 Secrets Manager 값 재확인

  secretStoreRef:
    name: team1-secretstore
    kind: SecretStore

  target:
    name: team1-backend-secret-env  # Deployment가 참조하는 Secret 이름

  data:
    - secretKey: DB_USERNAME       # K8s Secret 안에서 쓰일 키 이름
      remoteRef:
        key: team1/backend/secrets  # Secrets Manager의 시크릿 이름
        property: DB_USERNAME       # 그중 이 속성만 추출
    - secretKey: DB_PASSWORD
      remoteRef:
        key: team1/backend/secrets
        property: DB_PASSWORD
