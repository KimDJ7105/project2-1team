# Grafana admin 비밀번호를 Secrets Manager에서 가져와 k8s Secret으로 동기화
# (external-secret.yaml의 team1-backend 패턴과 동일)

apiVersion: v1
kind: ServiceAccount
metadata:
  # monitoring.tf의 IRSA 설정(namespace_service_accounts)과 이름이 일치해야 함
  name: monitoring-secrets-sa
  namespace: monitoring
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::727646470302:role/team1-monitoring-secrets-irsa"

---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: monitoring-secretstore
  namespace: monitoring
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: monitoring-secrets-sa

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h # 1시간마다 Secrets Manager 값 재확인

  secretStoreRef:
    name: monitoring-secretstore
    kind: SecretStore

  target:
    name: grafana-admin-credentials # kube-prometheus-stack의 grafana.admin.existingSecret이 참조하는 이름

  data:
    - secretKey: admin-user
      remoteRef:
        key: team1/monitoring/grafana-admin
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: team1/monitoring/grafana-admin
        property: admin-password
