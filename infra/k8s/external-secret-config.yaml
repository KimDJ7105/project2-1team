# SecretStore: Parameter Store 조회 방법/권한 정의
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: team1-parameterstore
  namespace: default
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: team1-backend-sa
---
# ExternalSecret: 비민감 설정값 8개를 Kubernetes Secret으로 동기화
# find 방식 대신 파라미터별로 명시해 secretKey 이름을 원하는 대로 지정
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: team1-backend-config
  namespace: default
spec:
  refreshInterval: 1h  # 1시간마다 Parameter Store 값 재확인

  secretStoreRef:
    name: team1-parameterstore
    kind: SecretStore

  target:
    name: team1-backend-config-env  # Deployment가 참조하는 Secret 이름

  data:
    - secretKey: DB_HOST
      remoteRef:
        key: /team1/backend/DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: /team1/backend/DB_PORT
    - secretKey: DB_NAME
      remoteRef:
        key: /team1/backend/DB_NAME
    - secretKey: REDIS_HOST
      remoteRef:
        key: /team1/backend/REDIS_HOST
    - secretKey: REDIS_PORT
      remoteRef:
        key: /team1/backend/REDIS_PORT
    - secretKey: REDIS_URL
      remoteRef:
        key: /team1/backend/REDIS_URL
    - secretKey: CLIENT_URL
      remoteRef:
        key: /team1/backend/CLIENT_URL
    - secretKey: S3_PROFILE_BUCKET
      remoteRef:
        key: /team1/backend/S3_PROFILE_BUCKET
    - secretKey: S3_REGION
      remoteRef:
        key: /team1/backend/S3_REGION
