<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>team1-backend 접속 모니터</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #1b1d23;
    --card: #24262e;
    --border: #363945;
    --text: #e6e6e6;
    --text-sub: #9aa0ab;
    --accent: #3ecfc0;
    --warn: #e0a94c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--text-sub); font-size: 13px; margin-bottom: 20px; }
  .nodes { display: flex; flex-direction: column; gap: 20px; }
  .node-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .node-header {
    background: #2d3038;
    padding: 10px 16px;
    font-weight: 600;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
  }
  .pods { display: flex; flex-wrap: wrap; gap: 14px; padding: 14px; }
  .pod-card {
    flex: 1 1 320px;
    min-width: 320px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .pod-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pod-ip { color: var(--text-sub); font-weight: 400; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-sub); font-weight: 500; }
  .type-disconnect { color: #e07a5f; }
  .type-reconnect { color: var(--accent); }
  .type-duplicate_login { color: var(--warn); }
  .empty { color: var(--text-sub); font-size: 12.5px; padding: 8px 0; }
  .ts { color: var(--text-sub); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .err { color: #e07a5f; font-size: 12px; }
</style>
</head>
<body>
  <h1>team1-backend 접속 모니터</h1>
  <div class="sub" id="meta">불러오는 중...</div>
  <div class="nodes" id="nodes"></div>

<script>
const REFRESH_MS = 5000;

const TYPE_LABEL = {
  disconnect: '연결 해제',
  reconnect: '재접속(새로고침)',
  duplicate_login: '중복 접속 감지',
};

function fmtTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ` +
    `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function renderEventRow(ev) {
  const who = ev.email ? `${ev.nickname} (${ev.email})` : ev.nickname;
  return `<tr>
    <td class="ts">${fmtTime(ev.timestamp)}</td>
    <td>${who}</td>
    <td class="type-${ev.type}">${TYPE_LABEL[ev.type] || ev.type}</td>
    <td>${ev.socketId || ev.oldSocketId || '-'}</td>
  </tr>`;
}

function renderPod(pod) {
  const rows = pod.events.length
    ? pod.events.map(renderEventRow).join('')
    : `<tr><td colspan="4" class="empty">최근 활동 없음</td></tr>`;

  const errHtml = pod.error ? `<div class="err">로그 조회 실패: ${pod.error}</div>` : '';

  return `
    <div class="pod-card">
      <div class="pod-title">
        <span>${pod.podName}</span>
        <span class="pod-ip">${pod.podIP || ''}</span>
      </div>
      ${errHtml}
      <table>
        <thead><tr><th>시각</th><th>유저</th><th>이벤트</th><th>소켓 ID</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function groupByNode(pods) {
  const groups = new Map();
  for (const pod of pods) {
    const key = pod.nodeName || '(알 수 없음)';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(pod);
  }
  return groups;
}

async function refresh() {
  const metaEl = document.getElementById('meta');
  const nodesEl = document.getElementById('nodes');
  try {
    const res = await fetch('/api/connections');
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    metaEl.textContent =
      `마지막 갱신: ${fmtTime(data.fetchedAt)} ` +
      `· ${data.pods.length}개 파드 · ${REFRESH_MS / 1000}초마다 자동 갱신`;

    const groups = groupByNode(data.pods);
    let html = '';
    for (const [nodeName, pods] of groups) {
      html += `
        <div class="node-card">
          <div class="node-header">
            <span>노드: ${nodeName}</span>
            <span>${pods.length}개 파드</span>
          </div>
          <div class="pods">${pods.map(renderPod).join('')}</div>
        </div>`;
    }
    nodesEl.innerHTML = html || '<div class="empty">파드가 없습니다.</div>';
  } catch (err) {
    metaEl.textContent = '오류: ' + err.message;
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
