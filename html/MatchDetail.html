<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>증강오목 - 전적 상세보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-1:#f6dfae;
    --wood-2:#f2d29a;
    --wood-line:#3d2c1a;
    --stone-black-a:#5a5a5a;
    --stone-black-b:#1c1c1c;
    --stone-white-b:#d8d0c0;
    --teal:#3ecfc0;
    --teal-dark:#22988c;
    --text-main:#4a3823;
    --text-sub:#93805f;
    --card-border:#f0dfc0;
    --page-bg:#e9e2d3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Gowun Dodum', sans-serif;
    background:var(--page-bg);
    color:var(--text-main);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .phone{
    width:390px;
    height:750px;
    background:#fff7e8;
    border-radius:34px;
    overflow:hidden;
    box-shadow:0 24px 48px -18px #0000004a;
    display:flex;
    flex-direction:column;
  }
  .pad{padding:18px 18px 0; display:flex; flex-direction:column; flex:1; min-height:0;}
  .row{display:flex; align-items:center; gap:10px;}

  .muted{color:var(--text-sub);}

  .avatar{
    width:46px;height:46px;border-radius:50%;
    background:linear-gradient(135deg,#ffd9a0,#ffb877);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; flex-shrink:0;
  }

  .matchup{
    display:flex; align-items:center; justify-content:center;
    gap:18px; margin:16px 0 14px;
  }
  .matchup .side{text-align:center;}
  .matchup .name{font-size:12px; font-weight:700; margin-top:6px;}
  .result-badge{
    background:var(--teal); color:#0e3833;
    font-family:'Jua', sans-serif; font-size:13px;
    padding:6px 14px; border-radius:12px;
  }

  .board-mini{
    position:relative;
    height:180px; margin:0 4px 14px;
    border-radius:14px; overflow:hidden;
    background:linear-gradient(150deg,var(--wood-1),var(--wood-2));
    border:6px solid #d9ad6e;
  }
  .board-mini .grid-lines{
    position:absolute; inset:6px;
    background-image:
      linear-gradient(var(--wood-line) 1.5px, transparent 1.5px),
      linear-gradient(90deg, var(--wood-line) 1.5px, transparent 1.5px);
    background-size:22px 22px; opacity:.5;
  }
  .stone{position:absolute; width:16px;height:16px; border-radius:50%;}
  .stone.b{background:radial-gradient(circle at 32% 26%, var(--stone-black-a), var(--stone-black-b) 72%); box-shadow:0 2px 3px #0006;}
  .stone.w{background:radial-gradient(circle at 32% 26%, #fff, var(--stone-white-b) 78%); box-shadow:0 2px 3px #0003;}
  .stone.aug::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--teal);}

  .list-item{
    background:#fffefb; border:1.5px solid var(--card-border);
    border-radius:13px; padding:11px 14px;
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }

  .btn{
    border:none; border-radius:14px; font-family:'Jua', sans-serif;
    font-size:14px; padding:12px; cursor:pointer; text-align:center;
    width:100%;
    background:#fffefb; border:1.5px solid var(--card-border);
    color:var(--text-main);
  }
  .btn:active{transform:translateY(2px);}
</style>
</head>
<body>

<div class="phone">
  <div class="pad">

    <div class="row">
      <span>←</span>
      <b>대국 상세</b>
    </div>

    <div class="matchup">
      <div class="side">
        <div class="avatar">🦁</div>
        <div class="name">사자 (흑)</div>
      </div>
      <div class="result-badge">승리</div>
      <div class="side">
        <div class="avatar">☁️</div>
        <div class="name">구름 (백)</div>
      </div>
    </div>

    <div class="board-mini">
      <div class="grid-lines"></div>
      <div class="stone b" style="top:32%;left:34%;"></div>
      <div class="stone w" style="top:42%;left:42%;"></div>
      <div class="stone b" style="top:50%;left:50%;"></div>
      <div class="stone w aug" style="top:58%;left:58%;"></div>
      <div class="stone b" style="top:66%;left:66%;"></div>
    </div>

    <div class="list-item"><span class="muted">대국 시간</span><b>5분 전 · 43턴</b></div>
    <div class="list-item"><span class="muted">사자가 쓴 증강</span><span>➕ 추가 착수</span></div>
    <div class="list-item"><span class="muted">구름이 쓴 증강</span><span>✖️ 상대 돌 제거</span></div>
    <div class="list-item"><span class="muted">레이팅 변화</span><b style="color:var(--teal-dark);">1200 → 1210 (+10)</b></div>

    <div style="flex:1;"></div>

    <button class="btn" style="margin-bottom:18px;">← 전적 목록으로</button>

  </div>
</div>

</body>
</html>
