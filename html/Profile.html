<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>증강오목 - 프로필</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#3ecfc0;
    --teal-dark:#22988c;
    --yellow:#ffcd4a;
    --text-main:#4a3823;
    --text-sub:#93805f;
    --card-border:#f0dfc0;
    --page-bg:#e9e2d3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Gowun Dodum', sans-serif;
    background:var(--page-bg);
    color:var(--text-main);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .phone{
    width:390px;
    height:750px;
    background:#fff7e8;
    border-radius:34px;
    overflow:hidden;
    box-shadow:0 24px 48px -18px #0000004a;
    display:flex;
    flex-direction:column;
  }
  .pad{padding:18px 18px 0; display:flex; flex-direction:column; flex:1; min-height:0;}
  .row{display:flex; align-items:center; gap:10px;}

  .avatar.lg{
    width:70px; height:70px; border-radius:50%;
    background:linear-gradient(135deg,#ffd9a0,#ffb877);
    display:flex; align-items:center; justify-content:center;
    font-size:34px;
  }
  .badge{
    background:var(--yellow); color:var(--text-main);
    font-size:12px; font-weight:700; padding:3px 9px;
    border-radius:10px; display:inline-block; margin-top:3px;
  }

  .muted{color:var(--text-sub);}

  .list-item{
    background:#fffefb; border:1.5px solid var(--card-border);
    border-radius:13px; padding:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px;
  }

  .btn{
    border:none; border-radius:14px; font-family:'Jua', sans-serif;
    font-size:15px; padding:12px; cursor:pointer; text-align:center;
    width:100%;
  }
  .btn.ghost{
    background:#fffefb; border:1.5px solid var(--card-border);
    color:var(--text-main);
  }
  .btn:active{transform:translateY(2px);}

  .bottom-nav{
    display:flex; justify-content:space-around;
    padding:12px 6px; border-top:1.5px solid var(--card-border); background:#fffefb;
    font-size:10px; color:var(--text-sub);
  }
  .bottom-nav .item{display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;}
  .bottom-nav .item.active{color:var(--teal-dark); font-weight:700;}
</style>
</head>
<body>

<div class="phone">
  <div class="pad">

    <div class="row">
      <span>←</span>
      <b>프로필</b>
    </div>

    <div style="text-align:center; margin:16px 0 6px;">
      <div class="avatar lg" style="margin:0 auto 8px;">🦁</div>
      <b>사자</b>
      <span class="badge">Lv.12</span>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px;">
      <div class="list-item"><span class="muted" style="font-size:12px;">총 게임</span><b style="font-size:15px;">52</b></div>
      <div class="list-item"><span class="muted" style="font-size:12px;">승률</span><b style="font-size:15px;">59.6%</b></div>
      <div class="list-item"><span class="muted" style="font-size:12px;">승/패/무</span><b style="font-size:13px;">31/19/2</b></div>
      <div class="list-item"><span class="muted" style="font-size:12px;">레이팅</span><b style="font-size:15px;">1210</b></div>
    </div>

    <div style="flex:1;"></div>

    <button class="btn ghost">프로필 편집 →</button>

  </div>

  <div class="bottom-nav">
    <div class="item">🏠<span>홈</span></div>
    <div class="item">📊<span>전적</span></div>
    <div class="item">📖<span>도감</span></div>
    <div class="item active">👤<span>프로필</span></div>
  </div>
</div>
  
</body>
</html>
