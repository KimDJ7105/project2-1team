<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실시간 오목 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-1:#f6dfae;
    --wood-2:#f2d29a;
    --wood-line:#3d2c1a;
    --teal:#3ecfc0;
    --teal-dark:#22988c;
    --yellow:#ffcd4a;
    --yellow-dark:#e0a400;
    --text-main:#4a3823;
    --text-sub:#93805f;
    --card-border:#f0dfc0;
    --page-bg:#e9e2d3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Gowun Dodum', sans-serif;
    background:var(--page-bg);
    color:var(--text-main);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:#fff7e8;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 40px #0000001a;
  }
  .pad{padding:22px 20px;}
  .row{display:flex; align-items:center; gap:10px;}
  .between{justify-content:space-between;}

  .avatar{
    width:44px;height:44px;border-radius:50%;
    background:linear-gradient(135deg,#ffd9a0,#ffb877);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; flex-shrink:0;
  }
  .badge{
    background:var(--yellow); color:var(--text-main);
    font-size:12px; font-weight:700; padding:3px 9px;
    border-radius:10px; display:inline-block; margin-top:3px;
  }

  .title-sm{font-family:'Jua', sans-serif;}
  .muted{color:var(--text-sub);}

  .btn{
    border:none; border-radius:14px; font-family:'Jua', sans-serif;
    font-size:16px; padding:14px; cursor:pointer; text-align:center;
    color:#0e3833; background:var(--teal);
    box-shadow:0 5px 0 var(--teal-dark);
    width:100%;
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--teal-dark);}

  .section-label{
    font-size:13px; font-weight:700; color:var(--text-sub);
    margin:24px 0 10px;
  }

  .room-list{display:flex; flex-direction:column; gap:10px;}
  .room-item{
    background:#fffefb; border:1.5px solid var(--card-border);
    border-radius:14px; padding:14px 16px;
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer;
  }
  .room-item .name{font-weight:700; display:flex; align-items:center; gap:8px;}
  .room-item .count{color:var(--text-sub); font-size:13px;}
  .room-item.full{opacity:.6;}

  .bottom-nav{
    margin-top:auto; display:flex; justify-content:space-around;
    padding:14px 6px; border-top:1.5px solid var(--card-border); background:#fffefb;
    font-size:11px; color:var(--text-sub);
  }
  .bottom-nav .item{display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;}
  .bottom-nav .item.active{color:var(--teal-dark); font-weight:700;}
</style>

</head>

<body>

<div class="phone">

    <div class="pad" style="display:flex; flex-direction:column; height:100%;">

        <!-- 상단 플레이어 정보 -->
        <div class="row between">

            <div class="row">
                <div class="avatar">🦁</div>
                <div>
                    <div style="font-weight:700;">사자 (흑)</div>
                    <span class="badge">내 차례</span>
                </div>
            </div>

            <div style="font-size:18px; font-weight:700;">
                ⏱ 00:45
            </div>

            <div class="row">
                <div style="text-align:right;">
                    <div style="font-weight:700;">구름 (백)</div>
                    <div class="muted" style="font-size:12px;">대기중</div>
                </div>
                <div class="avatar">☁️</div>
            </div>

        </div>

        <!-- 오목판 -->
        <div style="
            margin-top:25px;
            height:330px;
            border-radius:18px;
            background:linear-gradient(150deg,var(--wood-1),var(--wood-2));
            border:6px solid #d9ad6e;
            position:relative;
            overflow:hidden;">

            <!-- 격자 -->
            <div style="
                position:absolute;
                inset:10px;
                background-image:
                linear-gradient(var(--wood-line) 1.5px,transparent 1.5px),
                linear-gradient(90deg,var(--wood-line) 1.5px,transparent 1.5px);
                background-size:22px 22px;
                opacity:.5;">
            </div>

            <!-- 돌 -->
            <div style="position:absolute;left:120px;top:100px;width:18px;height:18px;border-radius:50%;background:#222;"></div>

            <div style="position:absolute;left:145px;top:123px;width:18px;height:18px;border-radius:50%;background:white;border:1px solid #bbb;"></div>

            <div style="position:absolute;left:170px;top:145px;width:18px;height:18px;border-radius:50%;background:#222;"></div>

            <div style="position:absolute;left:195px;top:168px;width:18px;height:18px;border-radius:50%;background:white;border:2px solid var(--teal);"></div>

            <div style="position:absolute;left:220px;top:191px;width:18px;height:18px;border-radius:50%;background:#222;"></div>

        </div>

        <!-- 증강 -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;">

            <div class="room-item">
                <span>🃏 내 증강</span>
                <span class="badge">추가 착수</span>
            </div>

            <div class="room-item">
                <span>🃏 상대 증강</span>
                <span class="muted">???</span>
            </div>

        </div>

        <div style="flex:1;"></div>

        <!-- 하단 버튼 -->
        <div class="row" style="gap:12px;">

            <button class="btn"
                style="
                background:#f6c9c1;
                color:#7a2a1c;
                box-shadow:0 5px 0 #d98d7d;">
                항복
            </button>

            <button class="btn">
                증강 사용 
            </button>

        </div>

    </div>

</div>

</body>
