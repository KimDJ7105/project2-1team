<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-1:#f6dfae;
    --wood-2:#f2d29a;
    --wood-line:#3d2c1a;
    --teal:#3ecfc0;
    --teal-dark:#22988c;
    --yellow:#ffcd4a;
    --yellow-dark:#e0a400;
    --text-main:#4a3823;
    --text-sub:#93805f;
    --card-border:#f0dfc0;
    --page-bg:#e9e2d3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Gowun Dodum', sans-serif;
    background:var(--page-bg);
    color:var(--text-main);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:#fff7e8;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 40px #0000001a;
  }
  .pad{padding:22px 20px;}
  .row{display:flex; align-items:center; gap:10px;}
  .between{justify-content:space-between;}

  .avatar{
    width:44px;height:44px;border-radius:50%;
    background:linear-gradient(135deg,#ffd9a0,#ffb877);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; flex-shrink:0;
  }
  .badge{
    background:var(--yellow); color:var(--text-main);
    font-size:12px; font-weight:700; padding:3px 9px;
    border-radius:10px; display:inline-block; margin-top:3px;
  }

  .title-sm{font-family:'Jua', sans-serif;}
  .muted{color:var(--text-sub);}

  .btn{
    border:none; border-radius:14px; font-family:'Jua', sans-serif;
    font-size:16px; padding:14px; cursor:pointer; text-align:center;
    color:#0e3833; background:var(--teal);
    box-shadow:0 5px 0 var(--teal-dark);
    width:100%;
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--teal-dark);}

  .section-label{
    font-size:13px; font-weight:700; color:var(--text-sub);
    margin:24px 0 10px;
  }

  .room-list{display:flex; flex-direction:column; gap:10px;}
  .room-item{
    background:#fffefb; border:1.5px solid var(--card-border);
    border-radius:14px; padding:14px 16px;
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer;
  }
  .room-item .name{font-weight:700; display:flex; align-items:center; gap:8px;}
  .room-item .count{color:var(--text-sub); font-size:13px;}
  .room-item.full{opacity:.6;}

  .bottom-nav{
    margin-top:auto; display:flex; justify-content:space-around;
    padding:14px 6px; border-top:1.5px solid var(--card-border); background:#fffefb;
    font-size:11px; color:var(--text-sub);
  }
  .bottom-nav .item{display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;}
  .bottom-nav .item.active{color:var(--teal-dark); font-weight:700;}
</style>

</head>

<body>

<div class="phone">

    <div class="pad" style="display:flex; flex-direction:column; height:100%;">

        <!-- 상단 -->
        <div class="row">
            <span style="font-size:22px;">←</span>
            <span style="font-weight:700;">방 만들기</span>
        </div>

        <!-- 입력 영역 -->
        <div style="margin-top:90px;">

            <p class="muted" style="font-size:15px; margin-bottom:10px;">
                방 이름
            </p>

            <input
                type="text"
                maxlength="20"
                placeholder="사자의 방"
                style="
                    width:100%;
                    height:64px;
                    border:1.5px solid var(--card-border);
                    border-radius:20px;
                    padding:0 18px;
                    font-size:18px;
                    font-family:'Gowun Dodum', sans-serif;
                    color:var(--text-main);
                    outline:none;
                ">

            <p style="
                text-align:center;
                color:var(--teal);
                font-size:15px;
                font-weight:700;
                margin-top:28px;">
                방 이름을 입력하세요 (최대 20자)
            </p>

        </div>

        <div style="flex:1;"></div>

        <!-- 안내 -->
        <p class="muted"
           style="text-align:center; margin-bottom:18px;">
            상대가 참가하면 대국이 시작돼요
        </p>

        <!-- 버튼 -->
        <button class="btn">
            방 생성하기
        </button>

    </div>

</div>

</body>
</html>
