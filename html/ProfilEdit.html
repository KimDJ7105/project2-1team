<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>증강오목 - 프로필 편집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#3ecfc0;
    --teal-dark:#22988c;
    --text-main:#4a3823;
    --text-sub:#93805f;
    --card-border:#f0dfc0;
    --page-bg:#e9e2d3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Gowun Dodum', sans-serif;
    background:var(--page-bg);
    color:var(--text-main);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .phone{
    width:390px;
    height:750px;
    background:#fff7e8;
    border-radius:34px;
    overflow:hidden;
    box-shadow:0 24px 48px -18px #0000004a;
    display:flex;
    flex-direction:column;
  }
  .pad{padding:18px 18px 0; display:flex; flex-direction:column; flex:1; min-height:0;}
  .row{display:flex; align-items:center; gap:10px;}

  .avatar-wrap{position:relative; width:90px; margin:0 auto;}
  .avatar.xl{
    width:90px; height:90px; border-radius:50%;
    background:linear-gradient(135deg,#ffd9a0,#ffb877);
    display:flex; align-items:center; justify-content:center;
    font-size:40px;
  }
  .camera-badge{
    position:absolute; bottom:0; right:0;
    width:28px; height:28px; border-radius:50%;
    background:var(--teal); border:3px solid #fff7e8;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; cursor:pointer;
  }

  .muted{color:var(--text-sub);}
  .field-label{font-size:12px; font-weight:700; color:var(--text-sub); margin:16px 0 6px;}
  input, textarea{
    width:100%;
    background:#fffefb; border:1.5px solid var(--card-border); border-radius:12px;
    padding:12px 13px; font-size:14px; font-family:'Gowun Dodum', sans-serif;
    color:var(--text-main); outline:none; resize:none;
  }
  input:focus, textarea:focus{ border-color:var(--teal); box-shadow:0 0 0 3px #3ecfc030; }

  .btn{
    border:none; border-radius:14px; font-family:'Jua', sans-serif;
    font-size:15px; padding:12px; cursor:pointer; text-align:center;
  }
  .btn.teal{ background:var(--teal); color:#0e3833; box-shadow:0 4px 0 var(--teal-dark); }
  .btn.ghost{ background:#fffefb; border:1.5px solid var(--card-border); color:var(--text-main); }
  .btn:active{transform:translateY(2px);}
</style>
</head>
<body>

<div class="phone">
  <div class="pad">

    <div class="row">
      <span>←</span>
      <b>프로필 편집</b>
    </div>

    <div style="text-align:center; margin:22px 0 4px;">
      <div class="avatar-wrap">
        <div class="avatar xl">🦁</div>
        <div class="camera-badge">📷</div>
      </div>
      <p class="muted" style="font-size:12px; margin-top:8px;">사진을 눌러 변경하세요</p>
    </div>

    <p class="field-label">닉네임</p>
    <input type="text" value="사자" maxlength="12">

    <p class="field-label">한 줄 소개</p>
    <textarea rows="2">오늘도 오목 한 판 어때요?</textarea>

    <div style="flex:1;"></div>

    <div class="row" style="gap:8px; padding-bottom:18px;">
      <button class="btn ghost" style="flex:1;">취소</button>
      <button class="btn teal" style="flex:1;">저장</button>
    </div>

  </div>
</div>

</body>
</html>
