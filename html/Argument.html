<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>증강오목 - 증강도감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#3ecfc0;
    --teal-dark:#22988c;
    --yellow:#ffcd4a;
    --text-main:#4a3823;
    --text-sub:#93805f;
    --card-border:#f0dfc0;
    --page-bg:#e9e2d3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Gowun Dodum', sans-serif;
    background:var(--page-bg);
    color:var(--text-main);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .phone{
    width:390px;
    height:750px;
    background:#fff7e8;
    border-radius:34px;
    overflow:hidden;
    box-shadow:0 24px 48px -18px #0000004a;
    display:flex;
    flex-direction:column;
  }
  .pad{padding:18px 18px 0; display:flex; flex-direction:column; flex:1; min-height:0;}
  .row{display:flex; align-items:center; gap:10px;}
  .between{justify-content:space-between;}

  .muted{color:var(--text-sub);}
  .count-tag{
    font-size:12px; font-weight:700; color:var(--teal-dark);
    background:#e6f9f6; padding:3px 10px; border-radius:9px;
  }

  .dex-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    overflow-y:auto; padding-bottom:8px;
  }
  .dex-card{
    background:#fffefb; border:1.5px solid var(--card-border);
    border-radius:14px; padding:14px 12px;
    display:flex; flex-direction:column; gap:6px; cursor:pointer;
  }
  .icon-box{
    width:42px; height:42px; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; background:#fff; border:1.5px solid var(--card-border);
  }
  .dex-name{font-weight:700; font-size:13px;}
  .dex-desc{font-size:11px; color:var(--text-sub); line-height:1.4;}
  .rarity{
    align-self:flex-start; font-size:9.5px; font-weight:700;
    padding:2px 7px; border-radius:7px; margin-top:2px;
  }
  .rarity.common{background:#e5e0d3; color:var(--text-sub);}
  .rarity.rare{background:#cfeeeb; color:var(--teal-dark);}
  .rarity.epic{background:#ffe2a8; color:#a06a00;}

  .bottom-nav{
    display:flex; justify-content:space-around;
    padding:12px 6px; border-top:1.5px solid var(--card-border); background:#fffefb;
    font-size:10px; color:var(--text-sub);
  }
  .bottom-nav .item{display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;}
  .bottom-nav .item.active{color:var(--teal-dark); font-weight:700;}
</style>
</head>
<body>

<div class="phone">
  <div class="pad">

    <div class="row between">
      <b style="font-size:15px;">증강도감</b>
      <span class="count-tag">8종 (예시)</span>
    </div>

    <p class="muted" style="font-size:11px; margin:8px 0 12px;">※ 증강 종류는 기획 확정 전 예시 데이터입니다</p>

    <div class="dex-grid">
      <div class="dex-card">
        <div class="icon-box">➕</div>
        <div class="dex-name">추가 착수</div>
        <div class="dex-desc">한 번 더 돌을 놓아요</div>
        <span class="rarity common">COMMON</span>
      </div>
      <div class="dex-card">
        <div class="icon-box">✖️</div>
        <div class="dex-name">상대 돌 제거</div>
        <div class="dex-desc">상대 돌 1개를 제거해요</div>
        <span class="rarity rare">RARE</span>
      </div>
      <div class="dex-card">
        <div class="icon-box">⏳</div>
        <div class="dex-name">한 턴 더</div>
        <div class="dex-desc">턴을 한 번 더 진행해요</div>
        <span class="rarity common">COMMON</span>
      </div>
      <div class="dex-card">
        <div class="icon-box">🎲</div>
        <div class="dex-name">랜덤 돌 생성</div>
        <div class="dex-desc">임의 위치에 내 돌을 생성해요</div>
        <span class="rarity rare">RARE</span>
      </div>
      <div class="dex-card">
        <div class="icon-box">🚫</div>
        <div class="dex-name">금지칸 생성</div>
        <div class="dex-desc">상대가 특정 칸을 못 쓰게 해요</div>
        <span class="rarity rare">RARE</span>
      </div>
      <div class="dex-card">
        <div class="icon-box">💥</div>
        <div class="dex-name">범위 공격</div>
        <div class="dex-desc">지정한 범위의 돌을 제거해요</div>
        <span class="rarity epic">EPIC</span>
      </div>
      <div class="dex-card">
        <div class="icon-box">↩️</div>
        <div class="dex-name">돌 무르기</div>
        <div class="dex-desc">직전 착수를 되돌려요</div>
        <span class="rarity common">COMMON</span>
      </div>
      <div class="dex-card">
        <div class="icon-box">🌫️</div>
        <div class="dex-name">안개 시야</div>
        <div class="dex-desc">상대 보드 일부를 가려요</div>
        <span class="rarity epic">EPIC</span>
      </div>
    </div>

  </div>

  <div class="bottom-nav">
    <div class="item">🏠<span>홈</span></div>
    <div class="item">📊<span>전적</span></div>
    <div class="item active">📖<span>도감</span></div>
    <div class="item">👤<span>프로필</span></div>
  </div>
</div>

</body>
</html>
