<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>증강오목 - 증강 선택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#3ecfc0;
    --teal-dark:#22988c;
    --yellow:#ffcd4a;
    --yellow-dark:#e0a400;
    --text-main:#4a3823;
    --text-sub:#93805f;
    --card-border:#f0dfc0;
    --page-bg:#e9e2d3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Gowun Dodum', sans-serif;
    background:var(--page-bg);
    color:var(--text-main);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .phone{
    width:390px;
    height:750px;
    background:#fff7e8;
    border-radius:34px;
    overflow:hidden;
    box-shadow:0 24px 48px -18px #0000004a;
    display:flex;
    flex-direction:column;
  }
  .pad{padding:18px 18px 0; display:flex; flex-direction:column; flex:1; min-height:0;}
  .row{display:flex; align-items:center; gap:10px;}
  .between{justify-content:space-between;}

  .muted{color:var(--text-sub);}
  .title{font-family:'Jua', sans-serif; font-size:18px; text-align:center; margin:4px 0 2px;}
  .sub{font-size:12px; text-align:center; color:var(--text-sub); margin:0 0 6px;}

  .timer{
    text-align:center; font-size:12px; font-weight:700; color:var(--teal-dark);
    background:#e6f9f6; border-radius:9px; padding:5px 10px;
    width:fit-content; margin:6px auto 18px;
  }

  .card-row{display:flex; gap:14px; flex:1;}
  .aug-card{
    flex:1; background:#fffefb; border:2px solid var(--card-border);
    border-radius:18px; padding:18px 14px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    cursor:pointer; transition:border-color .15s, transform .15s;
  }
  .aug-card:active{transform:scale(.97);}
  .aug-card.selected{border-color:var(--teal); box-shadow:0 0 0 3px #3ecfc030;}

  .icon-box{
    width:64px; height:64px; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    font-size:30px; background:#fff; border:1.5px solid var(--card-border);
  }
  .aug-name{font-weight:700; font-size:15px;}
  .aug-desc{font-size:11.5px; color:var(--text-sub); line-height:1.5;}
  .rarity{
    font-size:10px; font-weight:700; padding:3px 9px; border-radius:8px;
  }
  .rarity.common{background:#e5e0d3; color:var(--text-sub);}
  .rarity.rare{background:#cfeeeb; color:var(--teal-dark);}

  .hint{text-align:center; font-size:11.5px; color:var(--text-sub); margin:16px 0 10px;}

  .btn{
    border:none; border-radius:14px; font-family:'Jua', sans-serif;
    font-size:15px; padding:12px; cursor:pointer; text-align:center;
    width:100%; background:var(--teal); color:#0e3833;
    box-shadow:0 4px 0 var(--teal-dark);
  }
  .btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--teal-dark);}
</style>
</head>
<body>

<div class="phone">
  <div class="pad">

    <p class="title">증강을 선택하세요</p>
    <p class="sub">전체 8종 중 무작위 2개가 제시돼요</p>

    <div class="card-row" style="margin-top:14px;">
      <div class="aug-card selected">
        <div class="icon-box">➕</div>
        <div class="aug-name">추가 착수</div>
        <div class="aug-desc">한 번 더<br>돌을 놓을 수 있어요</div>
        <span class="rarity common">COMMON</span>
      </div>
      <div class="aug-card">
        <div class="icon-box">🌫️</div>
        <div class="aug-name">안개 시야</div>
        <div class="aug-desc">상대 보드<br>일부를 가려요</div>
        <span class="rarity rare">RARE</span>
      </div>
    </div>

    <p class="hint">카드를 눌러 하나를 고르면 바로 적용돼요</p>

    <button class="btn" style="margin-bottom:18px;">선택 완료</button>

  </div>
</div>

</body>
</html>
